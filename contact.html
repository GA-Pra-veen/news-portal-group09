<!DOCTYPE html>
<html>
<head>
    <title>University News Portal - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="bar">
      <a class="logo" href="index.html">University News Portal</a>

    </div>
  </header>


  <main>
    <h1>Contact us</h1>

    <div class="two">
      <section>
        <h2>Send us a message</h2>
        <form id="cf">
          <label for="n">Full name</label>
          <input id="n" name="name" type="text" required>

          <label for="e">Email</label>
          <input id="e" name="email" type="email" required>

          <label for="t">Topic</label>
          <select id="t" name="topic">
            <option value="news">Submit a news story</option>
            <option value="mistake">Report a mistake</option>
            <option value="enquiry">General enquiry</option>
          </select>

          
        </form>
      </section>

      <section>
        <h2>Editorial office</h2>
        <p>
          <strong>Address:</strong><br>
          University News Portal Office<br>
          Main Administration Building
        </p>
        <p>
          <strong>Email:</strong>
          <a href="mailto:news@university.example">news@university.example</a>
        </p>
        <p>
          <strong>Phone:</strong>
          <a href="tel:+94000000000">+94 00 000 0000</a>
        </p>
        <p>
          <strong>Office hours:</strong><br>
          Monday to Friday, 8.30 a.m. to 4.30 p.m.
        </p>
      </section>
    </div>
  </main>





</body>

</html>
